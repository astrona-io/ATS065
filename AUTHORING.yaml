version: 1
approval: CGOA requested 2026-10-11; reading-only rule lifted by the maintainer 2026-11-03 (labs, playgrounds, capstones and quizzes added)
course:
  id: ATS065
  certification:
    name: Certified GitOps Associate
    code: CGOA
    provider: CNCF / Linux Foundation
    domain: GitOps Principles
    weight: 30
    competencies:
    - Declarative
    - Versioned and Immutable
    - Pulled Automatically
    - Continuously Reconciled
defaults:
  playground: true
  module_lab: true
  capstone: true
  section_quiz: true
  final_quiz: true
assessment_format: YAML question banks v1 in sections/section-0X0/quiz.yaml and sections/final-domain-quiz.yaml
sections:
- id: section-010
  title: Declarative
  curriculum_item: Declarative
  capstone: true
  section_quiz: true
  modules:
  - id: module-01
    title: Declared State, Rendering And Controllers
    objectives:
    - Assess whether a declaration expresses sufficient managed intent.
    - Explain rendering inputs and controller ownership.
    - Distinguish declarative management from a script stored in version control.
    outline:
    - Sufficient Intent, Rendering And Controller Contracts
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-010/module-01/course-01-sufficient-intent-rendering-and-controller-contracts.md
      adapted_from: null
  - id: module-02
    title: Declarative Formats, Idempotence And Apply Semantics
    objectives:
    - Explain spec and status and which side belongs in Git.
    - Compare create, apply and replace and describe idempotence.
    - Explain server-side apply, field managers and conflicts.
    - Render a Helm chart from declared values.
    outline:
    - Spec, Status, Apply, Server-Side Apply And Renderers
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-010/module-02/course.md
      adapted_from: null
  - id: module-03
    title: Repository Layout And Environment Design
    objectives:
    - Lay out application and configuration repositories and environments.
    - Share manifests through a base and overlays.
    - Validate a declaration before merge.
    outline:
    - Repository Layout, Overlays, Settings And Validation
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-010/module-03/course.md
      adapted_from: null
- id: section-020
  title: Versioned and Immutable
  curriculum_item: Versioned and Immutable
  capstone: true
  section_quiz: true
  modules:
  - id: module-01
    title: Versions, References And Promotion
    objectives:
    - Explain immutable content identity and retained version history.
    - Distinguish promotion from rebuilding and mutable reference movement.
    - Reason about policy, artifact inputs and secret handling.
    outline:
    - Immutable Versions, Moving References And Auditable Promotion
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-020/module-01/course-01-immutable-versions-moving-references-and-auditable-promotion.md
      adapted_from: null
  - id: module-02
    title: Git History, Audit And Change Control
    objectives:
    - Answer audit questions from commits, authors and tags.
    - Explain what signed commits and tags prove and what they do not.
    - Use review, CODEOWNERS and branch protection as the control point.
    - Explain what rewriting history does to an agent that follows a branch.
    outline:
    - History, Signatures, Review And Rewriting
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-020/module-02/course.md
      adapted_from: null
  - id: module-03
    title: Release Management And Rollback
    objectives:
    - Choose version identifiers that tools and people can use.
    - Carry a release from build to declared state.
    - Roll back through Git without rewriting history.
    outline:
    - Releases, Image Update And Rollback
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-020/module-03/course.md
      adapted_from: null
- id: section-030
  title: Pulled Automatically
  curriculum_item: Pulled Automatically
  capstone: true
  section_quiz: true
  modules:
  - id: module-01
    title: Pull, Credentials And Webhooks
    objectives:
    - Explain agent retrieval of authoritative desired state.
    - Distinguish a notification from pushed authoritative deployment content.
    - Reason about source access, recovery and target credentials.
    outline:
    - Agent-Owned Retrieval And Event-Accelerated Reconciliation
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-030/module-01/course-01-agent-owned-retrieval-and-event-accelerated-reconciliation.md
      adapted_from: null
  - id: module-02
    title: The In-Cluster Agent And Pull Mechanics
    objectives:
    - Name the Argo CD components and the Flux controllers and their roles.
    - Explain network direction and where credentials live in a pull design.
    - Read the permissions of the agent and narrow them with a project.
    outline:
    - Argo CD Components, Flux Controllers, Network Direction And Permissions
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-030/module-02/course.md
      adapted_from: null
  - id: module-03
    title: Multi-Cluster Pull And Tenancy
    objectives:
    - Register clusters and compare agent topologies.
    - Limit a team with an AppProject.
    - Verify the source that the agent pulls.
    outline:
    - Clusters, Topologies, Projects And Source Trust
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-030/module-03/course.md
      adapted_from: null
- id: section-040
  title: Continuously Reconciled
  curriculum_item: Continuously Reconciled
  capstone: true
  section_quiz: true
  modules:
  - id: module-01
    title: Drift, Refresh And Reconciliation
    objectives:
    - Distinguish refresh and comparison from synchronization.
    - Explain live drift and source-driven updates.
    - Evaluate ignore-difference settings and controller-owned fields.
    - Compare bootstrap composition with ApplicationSet-generated Applications.
    outline:
    - Drift, Refresh, Ignore Rules And Reconciliation Patterns
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-040/module-01/course-01-drift-refresh-ignore-rules-and-reconciliation-patterns.md
      adapted_from: ATS061/sections/section-050/module-01/course-01-drift-refresh-ignore-rules-and-reconciliation-patterns.md
  - id: module-02
    title: Health, Sync Status And Feedback Loops
    objectives:
    - Tell sync status from health status and read both.
    - Order a sync with phases, hooks and waves.
    - Configure retries with exponential backoff.
    - Find the cause of a failure in conditions, events, logs and metrics.
    outline:
    - Sync And Health, Phases And Waves, Retries, Observability
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-040/module-02/course.md
      adapted_from: null
  - id: module-03
    title: Reconciliation At Scale
    objectives:
    - Generate Applications with an ApplicationSet.
    - Bootstrap a platform with app of apps.
    - Explain reconciliation load and progressive rollout.
    outline:
    - ApplicationSets, App Of Apps, Load And Rollouts
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-040/module-03/course.md
      adapted_from: null
