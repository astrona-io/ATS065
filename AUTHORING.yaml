  curriculum_item: Pulled Automatically
  capstone: true
  section_quiz: true
  modules:
  - id: module-01
    title: Pull, Credentials And Webhooks
    objectives:
    - Explain agent retrieval of authoritative desired state.
    - Distinguish a notification from pushed authoritative deployment content.
    - Reason about source access, recovery and target credentials.
    outline:
    - Agent-Owned Retrieval And Event-Accelerated Reconciliation
    playground: true
    module_lab: true
    sources:
