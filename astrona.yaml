  - id: module-040
    title: "Drift, Refresh And Reconciliation"
    description: >
      Makes the reader able to detect drift, choose a sync policy with prune
      and self-heal, and use narrow ignore rules and the app-of-apps pattern
      so reconciliation stays continuous.
    content:
      - type: reading
        title: Section Overview
