      - type: reading
        title: "Drift, Refresh And Reconciliation"
        path: sections/section-040/module-01/course.md
      - type: reading
        title: "Drift And Refresh"
        path: sections/section-040/module-01/course-01-drift-and-refresh.md
      - type: reading
        title: "Automated Sync, Self-Heal And Prune"
        path: sections/section-040/module-01/course-02-automated-sync-self-heal-and-prune.md
