# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Add A Production Environment From The Shared Base (LAB). Section 010.
# Argo CD 3.5.4 and an in-cluster Gitea server (plumbing only). Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-065-lab-010-03
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - ghcr.io/stefanprodan/podinfo:6.14.0
      - gitea/gitea:28.1.0-rootless
      - quay.io/argoproj/argocd:v3.5.4
      - public.ecr.aws/docker/library/redis:8.2.3-alpine
  portForwards:
    - name: argocd
      description: "Argo CD API server and web page"
      namespace: argocd
      resource: svc/argocd-server
      targetPort: 443
      hostPort: 8080
      scheme: https
    - name: gitea
      description: "The Git server (git over HTTP)"
      namespace: gitea
      resource: svc/gitea-http
      targetPort: 3000
      hostPort: 3000
      scheme: http

bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  init:
    - name: install-gitea
      description: "Starts the in-cluster Git server"
      type: file
      source: bootstrap/01-install-gitea.sh
    - name: install-argocd
      description: "Installs Argo CD 3.5.4 (non-HA, without Dex and notifications)"
      type: file
      source: bootstrap/02-install-argocd.sh
    - name: seed
      description: "Pushes the repositories into Git"
      type: file
      source: bootstrap/03-seed.sh
    - name: create-application
      description: "Creates the Application that delivers staging"
      type: file
      source: bootstrap/04-create-application.sh
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet

testing:
  init:
    - name: solution
      description: Reference solution applied by `astrona test`
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: layout
      description: "The base is unchanged and the production overlay sets its own message through a patch"
      type: file
      source: validation/validate-layout.sh
      hint: "Keep base/configmap.yaml as it is. Add a patch file in overlays/production and list it under patches in the production kustomization.yaml."
    - name: production-app
      description: "The Application scout-production delivers overlays/production with automated sync"
      type: file
      source: validation/validate-production-app.sh
      hint: "Create the Application scout-production in the namespace argocd with automated sync and CreateNamespace=true."
    - name: delivered
      description: "Production runs 2 replicas with the message production and staging is unchanged"
      type: file
      source: validation/validate-delivered.sh
      hint: "Push the overlay change before you create the Application, or refresh it after the push."

teardown:
  keepCluster: false
