# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Fix A Synced But Degraded Application (LAB). Section 040.
# Argo CD 3.5.4 and an in-cluster Gitea server (plumbing only). Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-065-lab-040-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - ghcr.io/stefanprodan/podinfo:6.14.0
      - gitea/gitea:28.1.0-rootless
      - quay.io/argoproj/argocd:v3.5.4
      - public.ecr.aws/docker/library/redis:8.2.3-alpine
  portForwards:
    - name: argocd
      description: "Argo CD API server and web page"
      namespace: argocd
      resource: svc/argocd-server
      targetPort: 443
      hostPort: 8080
      scheme: https
    - name: gitea
      description: "The Git server (git over HTTP)"
      namespace: gitea
      resource: svc/gitea-http
      targetPort: 3000
      hostPort: 3000
      scheme: http

bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  init:
    - name: install-gitea
      description: "Starts the in-cluster Git server"
      type: file
      source: bootstrap/01-install-gitea.sh
    - name: install-argocd
      description: "Installs Argo CD 3.5.4 (non-HA, without Dex and notifications)"
      type: file
      source: bootstrap/02-install-argocd.sh
    - name: seed
      description: "Pushes the repositories into Git"
      type: file
      source: bootstrap/03-seed.sh
    - name: create-application
      description: "Creates the Application that delivers a bad image tag"
      type: file
      source: bootstrap/04-create-application.sh
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet

testing:
  init:
    - name: solution
      description: Reference solution applied by `astrona test`
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: fixed-in-git
      description: "The bad tag is fixed in Git and the Application is Synced and Healthy"
      type: file
      source: validation/validate-fixed-in-git.sh
      hint: "Change newTag in overlays/staging/kustomization.yaml to 6.15.0, commit and push to main. Do not edit the live Deployment."
    - name: sync-wave
      description: "The ConfigMap scout-settings has sync wave -1 so that it is applied before the Deployment"
      type: file
      source: validation/validate-sync-wave.sh
      hint: "Add the annotation argocd.argoproj.io/sync-wave with the string value \"-1\" to base/configmap.yaml in Git."
    - name: retry
      description: "The Application retries a failed sync up to 5 times with a 10s backoff that doubles up to 3m"
      type: file
      source: validation/validate-retry.sh
      hint: "Add syncPolicy.retry with limit 5 and backoff duration 10s, factor 2 and maxDuration 3m to the Application."

teardown:
  keepCluster: false
