schema_version: 1
kind: question_bank
id: ats065-040
course_id: ATS065
exam_code: CGOA
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-040
  title: "Drift, Refresh, Health, Scale And Reconciliation"
questions:
  - id: ats065-040-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Define drift"
    source_readings:
      - sections/section-040/module-01/course-01-drift-and-refresh.md
    prompt: |-
      Someone runs `kubectl scale deployment scout --replicas=5`, and Git says `replicas: 2`. What is this called?
    options:
      - id: a
        text: "Drift: the live state differs from the declared state."
        explanation: "Correct. The Application shows `OutOfSync`."
      - id: b
        text: "A rollback."
        explanation: "A rollback returns to an earlier declared state."
      - id: c
        text: "A render error."
        explanation: "Rendering still succeeds."
      - id: d
        text: "A promotion."
        explanation: "A promotion changes the declaration through Git."
    correct_option: a
    explanation: "Correct. The Application shows `OutOfSync`."
  - id: ats065-040-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Tell Synced from Healthy"
    source_readings:
      - sections/section-040/module-01/course-01-drift-and-refresh.md
    prompt: |-
      An `Application` is `Synced` and `Degraded`. What does that mean?
    options:
      - id: a
        text: "The Application was deleted."
        explanation: "A deleted Application has no status."
      - id: b
        text: "The live objects match Git, but a resource is not healthy, for example pods that do not become ready."
        explanation: "Correct. Sync status compares state. Health reports whether it works."
      - id: c
        text: "The cluster differs from Git and pods are healthy."
        explanation: "That would be `OutOfSync` and `Healthy`."
      - id: d
        text: "Argo CD cannot reach the repository."
        explanation: "That appears as a condition on the Application."
    correct_option: b
    explanation: "Correct. Sync status compares state. Health reports whether it works."
  - id: ats065-040-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use a hard refresh"
    source_readings:
      - sections/section-040/module-01/course-01-drift-and-refresh.md
    prompt: |-
      A commit is pushed and the team does not want to wait for the poll. Which action triggers a refresh?
    options:
      - id: a
        text: "Restart the Gitea pod."
        explanation: "This does not notify Argo CD."
      - id: b
        text: "Scale `argocd-server` to zero."
        explanation: "This stops the API server."
      - id: c
        text: "Annotate the Application with `argocd.argoproj.io/refresh=normal`."
        explanation: "Correct. The `hard` value also discards cached manifests."
      - id: d
        text: "Delete the repository Secret."
        explanation: "This breaks access to the repository."
    correct_option: c
    explanation: "Correct. The `hard` value also discards cached manifests."
  - id: ats065-040-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Enable automated sync"
    source_readings:
      - sections/section-040/module-01/course-02-automated-sync-self-heal-and-prune.md
    prompt: |-
      With `syncPolicy.automated` and no other fields, what happens when the repository changes?
    options:
      - id: a
        text: "Argo CD applies the change, prunes removed objects and reverts live edits."
        explanation: "That needs `prune: true` and `selfHeal: true`."
      - id: b
        text: "Nothing is applied until a person clicks Sync."
        explanation: "That is manual sync."
      - id: c
        text: "Argo CD deletes the Application."
        explanation: "It does not."
      - id: d
        text: "Argo CD applies the change, does not prune removed objects and does not revert live edits."
        explanation: "Correct. `prune` and `selfHeal` are both false by default."
    correct_option: d
    explanation: "Correct. `prune` and `selfHeal` are both false by default."
  - id: ats065-040-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain self-heal"
    source_readings:
      - sections/section-040/module-01/course-02-automated-sync-self-heal-and-prune.md
    prompt: |-
      With `selfHeal: true`, a person edits the Deployment with `kubectl`. What happens?
    options:
      - id: a
        text: "The edit stays, because the live state wins."
        explanation: "Git is the source of truth for the Application."
      - id: b
        text: "Argo CD detects the difference and syncs the live object back to the declared state."
        explanation: "Correct. Self-heal reverts out-of-band changes."
      - id: c
        text: "Argo CD writes the edit into Git."
        explanation: "Argo CD never writes to Git."
      - id: d
        text: "The Application is deleted."
        explanation: "It is not deleted."
    correct_option: b
    explanation: "Correct. Self-heal reverts out-of-band changes."
  - id: ats065-040-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain prune"
    source_readings:
      - sections/section-040/module-01/course-02-automated-sync-self-heal-and-prune.md
    prompt: |-
      A manifest is removed from Git and `prune: true` is set. What does the next sync do?
    options:
      - id: a
        text: "It fails with a render error."
        explanation: "The render succeeds."
      - id: b
        text: "It keeps the live object."
        explanation: "That is the default without prune."
      - id: c
        text: "It deletes the live object that Argo CD tracked from that manifest."
        explanation: "Correct. Pruning removes tracked objects that are no longer declared."
      - id: d
        text: "It deletes every object in the namespace."
        explanation: "Only tracked objects are pruned."
    correct_option: c
    explanation: "Correct. Pruning removes tracked objects that are no longer declared."
  - id: ats065-040-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use an ignore rule"
    source_readings:
      - sections/section-040/module-01/course-03-ignore-rules-and-reconciliation-patterns.md
    prompt: |-
      An autoscaler owns `/spec/replicas`. Which setting makes Argo CD ignore that field when comparing?
    options:
      - id: a
        text: "Delete the `replicas` field from the Deployment in the cluster."
        explanation: "The comparison would still differ if the repository states it."
      - id: b
        text: "`targetRevision: HEAD`."
        explanation: "This selects a revision."
      - id: c
        text: "`ignoreDifferences` with `jsonPointers: [/spec/replicas]` on the Deployment."
        explanation: "Correct. Add `RespectIgnoreDifferences=true` so a sync does not overwrite the field either."
      - id: d
        text: "`prune: true`."
        explanation: "Prune removes objects, not fields."
    correct_option: c
    explanation: "Correct. Add `RespectIgnoreDifferences=true` so a sync does not overwrite the field either."
  - id: ats065-040-q08
    type: single_choice
    difficulty: advanced
    learning_objective: "Explain why RespectIgnoreDifferences matters"
    source_readings:
      - sections/section-040/module-01/course-03-ignore-rules-and-reconciliation-patterns.md
    prompt: |-
      An ignore rule exists, and a sync for another change overwrites the ignored field. What is missing?
    options:
      - id: a
        text: "A larger polling interval."
        explanation: "This does not change the apply behaviour."
      - id: b
        text: "A second repository."
        explanation: "A repository does not decide this."
      - id: c
        text: "A hard refresh."
        explanation: "A refresh does not change the sync behaviour."
      - id: d
        text: "The sync option `RespectIgnoreDifferences=true`, so the sync also skips the ignored field."
        explanation: "Correct. By default, ignore rules affect only the comparison."
    correct_option: d
    explanation: "Correct. By default, ignore rules affect only the comparison."
  - id: ats065-040-q09
    type: single_choice
    difficulty: advanced
    learning_objective: "Choose a reconciliation pattern"
    source_readings:
      - sections/section-040/module-01/course-03-ignore-rules-and-reconciliation-patterns.md
    prompt: |-
      A team wants production changes to wait for a person, but staging to follow Git automatically. What does this need?
    options:
      - id: a
        text: "The same sync policy on both Applications."
        explanation: "This does not give the difference."
      - id: b
        text: "Automated sync with prune and self-heal on staging, and manual sync on production."
        explanation: "Correct. The policy is set on each Application."
      - id: c
        text: "Manual sync on staging and automated sync on production."
        explanation: "This reverses the intent."
      - id: d
        text: "No Applications, only `kubectl`."
        explanation: "This leaves the declarative model."
    correct_option: b
    explanation: "Correct. The policy is set on each Application."
  - id: ats065-040-q10
    type: single_choice
    difficulty: beginner
    learning_objective: "Read sync and health"
    source_readings:
      - sections/section-040/module-02/course-01-sync-status-and-health-status.md
    prompt: |-
      An Application shows `Synced` and `Degraded`. What does this mean?
    options:
      - id: a
        text: "The cluster matches Git, and one or more resources are not working."
        explanation: "Sync status compares Git and the cluster. Health status asks whether the resources work."
      - id: b
        text: "The cluster differs from Git, and everything works."
        explanation: "That is `OutOfSync` and `Healthy`."
      - id: c
        text: "Git cannot be read."
        explanation: "That would give `Unknown` for the sync status."
      - id: d
        text: "The Application is deleted."
        explanation: "A deleted Application has no status."
    correct_option: a
    explanation: "Correct. Sync status compares Git and the cluster. Health status asks whether the resources work."
  - id: ats065-040-q11
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the sync statuses"
    source_readings:
      - sections/section-040/module-02/course-01-sync-status-and-health-status.md
    prompt: |-
      Which values can the sync status of an Application have?
    options:
      - id: a
        text: "`Healthy`, `Degraded` and `Missing`."
        explanation: "These are health values."
      - id: b
        text: "`Synced`, `OutOfSync` and `Unknown`."
        explanation: "These are the three values of the comparison."
      - id: c
        text: "`Pending`, `Running` and `Failed`."
        explanation: "These are not sync statuses."
      - id: d
        text: "`Ready` and `NotReady`."
        explanation: "These are Flux condition values."
    correct_option: b
    explanation: "Correct. These are the three values of the comparison."
  - id: ats065-040-q12
    type: single_choice
    difficulty: intermediate
    learning_objective: "Aggregate health"
    source_readings:
      - sections/section-040/module-02/course-01-sync-status-and-health-status.md
    prompt: |-
      An Application has 5 healthy resources and 1 degraded Deployment. What is the health of the Application?
    options:
      - id: a
        text: "`Healthy`, because most resources are healthy."
        explanation: "It is not a majority vote."
      - id: b
        text: "`Progressing`, always."
        explanation: "The value follows the worst resource."
      - id: c
        text: "`Degraded`, because the Application takes the worst health of its resources."
        explanation: "One failed resource is enough."
      - id: d
        text: "`Missing`, because one resource failed."
        explanation: "`Missing` means the object does not exist."
    correct_option: c
    explanation: "Correct. One failed resource is enough."
  - id: ats065-040-q13
    type: single_choice
    difficulty: advanced
    learning_objective: "Add a custom health check"
    source_readings:
      - sections/section-040/module-02/course-01-sync-status-and-health-status.md
    prompt: |-
      A custom resource always shows as healthy as soon as it exists, even when its controller reports an error. How is this fixed?
    options:
      - id: a
        text: "Add an annotation `health: false` to the Application."
        explanation: "No such annotation exists."
      - id: b
        text: "Delete the custom resource definition."
        explanation: "This removes the type."
      - id: c
        text: "Increase the `replicas` of the controller."
        explanation: "The number of replicas does not change health rules."
      - id: d
        text: "Add a custom health check in Lua to `argocd-cm` that reads the `status` of the resource."
        explanation: "Without a check, Argo CD only knows that the object exists."
    correct_option: d
    explanation: "Correct. Without a check, Argo CD only knows that the object exists."
  - id: ats065-040-q14
    type: single_choice
    difficulty: beginner
    learning_objective: "Order the phases"
    source_readings:
      - sections/section-040/module-02/course-02-sync-phases-waves-and-hooks.md
    prompt: |-
      Which order is correct for a sync that succeeds?
    options:
      - id: a
        text: "`PreSync`, `Sync`, `PostSync`."
        explanation: "`SyncFail` runs only when the sync fails."
      - id: b
        text: "`Sync`, `PreSync`, `PostSync`."
        explanation: "PreSync runs first."
      - id: c
        text: "`PostSync`, `Sync`, `PreSync`."
        explanation: "This reverses the order."
      - id: d
        text: "`PreSync`, `PostSync`, `Sync`."
        explanation: "PostSync runs after the main apply."
    correct_option: a
    explanation: "Correct. `SyncFail` runs only when the sync fails."
  - id: ats065-040-q15
    type: single_choice
    difficulty: intermediate
    learning_objective: "Stop a sync with a hook"
    source_readings:
      - sections/section-040/module-02/course-02-sync-phases-waves-and-hooks.md
    prompt: |-
      A `PreSync` hook Job fails. What happens to the main apply?
    options:
      - id: a
        text: "It starts anyway."
        explanation: "A failed PreSync hook stops the sync."
      - id: b
        text: "It does not start, so the running workload stays unchanged."
        explanation: "A failed PreSync hook fails the sync before anything is applied."
      - id: c
        text: "It applies half of the resources."
        explanation: "Nothing in the Sync phase starts."
      - id: d
        text: "It is retried forever without a retry policy."
        explanation: "Retries need a policy."
    correct_option: b
    explanation: "Correct. A failed PreSync hook fails the sync before anything is applied."
  - id: ats065-040-q16
    type: single_choice
    difficulty: intermediate
    learning_objective: "Order resources with waves"
    source_readings:
      - sections/section-040/module-02/course-02-sync-phases-waves-and-hooks.md
    prompt: |-
      A ConfigMap has sync wave `-1` and a Deployment has the default wave. In what order does Argo CD apply them?
    options:
      - id: a
        text: "The Deployment first."
        explanation: "The lower wave goes first."
      - id: b
        text: "Both at once."
        explanation: "Different waves are applied in order."
      - id: c
        text: "The ConfigMap first, then the Deployment after the ConfigMap is healthy."
        explanation: "Lower waves go first, the default is 0, and Argo CD waits for health between waves."
      - id: d
        text: "In alphabetical order of their names."
        explanation: "Names order resources only inside the same wave."
    correct_option: c
    explanation: "Correct. Lower waves go first, the default is 0, and Argo CD waits for health between waves."
  - id: ats065-040-q17
    type: single_choice
    difficulty: intermediate
    learning_objective: "Clean up a hook"
    source_readings:
      - sections/section-040/module-02/course-02-sync-phases-waves-and-hooks.md
    prompt: |-
      Which delete policy removes a hook Job after it succeeds?
    options:
      - id: a
        text: "`HookFailed`"
        explanation: "This removes it after a failure."
      - id: b
        text: "`BeforeHookCreation`"
        explanation: "This removes the previous one before the next run."
      - id: c
        text: "`Never`"
        explanation: "This is not a delete policy value."
      - id: d
        text: "`HookSucceeded`"
        explanation: "`HookFailed` removes it after a failure and `BeforeHookCreation` removes the old one before a new run."
    correct_option: d
    explanation: "Correct. `HookFailed` removes it after a failure and `BeforeHookCreation` removes the old one before a new run."
  - id: ats065-040-q18
    type: single_choice
    difficulty: advanced
    learning_objective: "Configure a retry"
    source_readings:
      - sections/section-040/module-02/course-03-retries-and-failed-syncs.md
    prompt: |-
      With `limit: 5`, `duration: 10s`, `factor: 2` and `maxDuration: 3m`, what are the waits before the retries?
    options:
      - id: a
        text: "10, 20, 40, 80 and 160 seconds."
        explanation: "Each wait is multiplied by the factor, and none reaches the cap of three minutes."
      - id: b
        text: "10 seconds each time."
        explanation: "The factor multiplies the wait."
      - id: c
        text: "10, 20, 40, 80 and 180 seconds."
        explanation: "160 seconds is below the cap, so it is not raised."
      - id: d
        text: "5 retries with no wait."
        explanation: "The backoff sets the wait."
    correct_option: a
    explanation: "Correct. Each wait is multiplied by the factor, and none reaches the cap of three minutes."
  - id: ats065-040-q19
    type: single_choice
    difficulty: intermediate
    learning_objective: "Find the cause of a failure"
    source_readings:
      - sections/section-040/module-02/course-04-observing-reconciliation.md
    prompt: |-
      An Application shows sync status `Unknown` and a condition of type `ComparisonError`. Where should you look next?
    options:
      - id: a
        text: "The nodes of the cluster, for disk space."
        explanation: "The error is about the comparison."
      - id: b
        text: "The message of the condition, then the repository server log, for a render or Git error."
        explanation: "Comparison errors come from fetching or rendering the desired state."
      - id: c
        text: "The Ingress controller log."
        explanation: "It handles traffic, not rendering."
      - id: d
        text: "Nothing. Unknown means the Application is healthy."
        explanation: "Unknown is a failure to compare."
    correct_option: b
    explanation: "Correct. Comparison errors come from fetching or rendering the desired state."
  - id: ats065-040-q20
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use PruneLast"
    source_readings:
      - sections/section-040/module-01/course-04-sync-options-and-sync-windows.md
    prompt: |-
      What does the sync option `PruneLast=true` do?
    options:
      - id: a
        text: "It deletes pruned objects after the other objects are synced and healthy."
        explanation: "Deletion is ordered after the rest of the sync."
      - id: b
        text: "It prunes before anything else."
        explanation: "The option moves pruning to the end."
      - id: c
        text: "It disables pruning."
        explanation: "Pruning still happens."
      - id: d
        text: "It prunes only namespaces."
        explanation: "It applies to pruned objects of any kind."
    correct_option: a
    explanation: "Correct. Deletion is ordered after the rest of the sync."
  - id: ats065-040-q21
    type: single_choice
    difficulty: beginner
    learning_objective: "Describe an ApplicationSet"
    source_readings:
      - sections/section-040/module-03/course-01-applicationsets-and-generators.md
    prompt: |-
      What does an ApplicationSet do?
    options:
      - id: a
        text: "It replaces the Git repository."
        explanation: "It reads a repository."
      - id: b
        text: "It renders a template once per set of parameters from a generator and owns the resulting Application objects."
        explanation: "The set creates and maintains Applications from data."
      - id: c
        text: "It syncs one Application faster."
        explanation: "It generates Applications."
      - id: d
        text: "It stores secrets."
        explanation: "It does not."
    correct_option: b
    explanation: "Correct. The set creates and maintains Applications from data."
  - id: ats065-040-q22
    type: single_choice
    difficulty: intermediate
    learning_objective: "Pick a generator"
    source_readings:
      - sections/section-040/module-03/course-01-applicationsets-and-generators.md
    prompt: |-
      A new folder under `overlays` should create a new Application with no change to the ApplicationSet. Which generator fits?
    options:
      - id: a
        text: "The list generator."
        explanation: "The list is fixed in the manifest."
      - id: b
        text: "The pullRequest generator."
        explanation: "It follows open pull requests."
      - id: c
        text: "The git generator with directories."
        explanation: "It creates one element per folder."
      - id: d
        text: "No generator can do this."
        explanation: "The git directory generator does."
    correct_option: c
    explanation: "Correct. It creates one element per folder."
  - id: ats065-040-q23
    type: single_choice
    difficulty: intermediate
    learning_objective: "Describe app of apps"
    source_readings:
      - sections/section-040/module-03/course-02-app-of-apps-and-bootstrapping.md
    prompt: |-
      In the app-of-apps pattern, what does the root Application point at?
    options:
      - id: a
        text: "A folder of container images."
        explanation: "Images are not manifests."
      - id: b
        text: "The kube-system namespace."
        explanation: "Applications live in argocd."
      - id: c
        text: "The Git server database."
        explanation: "It does not read it."
      - id: d
        text: "A folder of manifests that are themselves Application objects, in the `argocd` namespace."
        explanation: "Children are declared as files and the root delivers them."
    correct_option: d
    explanation: "Correct. Children are declared as files and the root delivers them."
  - id: ats065-040-q24
    type: single_choice
    difficulty: intermediate
    learning_objective: "Shard the controller"
    source_readings:
      - sections/section-040/module-03/course-03-controlling-reconciliation-load.md
    prompt: |-
      Which setting must match the replica count when the application controller is sharded?
    options:
      - id: a
        text: "The environment variable `ARGOCD_CONTROLLER_REPLICAS`."
        explanation: "Each replica needs the total count to know its share of clusters."
      - id: b
        text: "`PruneLast=true`"
        explanation: "This is a sync option."
      - id: c
        text: "`targetRevision`"
        explanation: "This is a source field."
      - id: d
        text: "`spec.project`"
        explanation: "This is an Application field."
    correct_option: a
    explanation: "Correct. Each replica needs the total count to know its share of clusters."
  - id: ats065-040-q25
    type: single_choice
    difficulty: intermediate
    learning_objective: "Avoid re-rendering"
    source_readings:
      - sections/section-040/module-03/course-03-controlling-reconciliation-load.md
    prompt: |-
      What does the annotation `argocd.argoproj.io/manifest-generate-paths` do?
    options:
      - id: a
        text: "It signs the commit."
        explanation: "It does not sign."
      - id: b
        text: "It lists the paths whose changes require re-rendering, so unrelated commits in a monorepo reuse cached manifests."
        explanation: "It reduces repository server work."
      - id: c
        text: "It selects the cluster."
        explanation: "It lists paths."
      - id: d
        text: "It deletes cached secrets."
        explanation: "It does not."
    correct_option: b
    explanation: "Correct. It reduces repository server work."
  - id: ats065-040-q26
    type: single_choice
    difficulty: advanced
    learning_objective: "State the status of progressive sync"
    source_readings:
      - sections/section-040/module-03/course-04-progressive-rollouts-across-environments.md
    prompt: |-
      What is the status of progressive sync (`RollingSync`) in an ApplicationSet?
    options:
      - id: a
        text: "It is stable and always on."
        explanation: "It is alpha."
      - id: b
        text: "It was removed."
        explanation: "It exists as alpha."
      - id: c
        text: "It is an alpha feature and is off by default, so it must be enabled and its fields may change."
        explanation: "The feature needs to be enabled in the controller."
      - id: d
        text: "It only works with Flux."
        explanation: "It belongs to the ApplicationSet."
    correct_option: c
    explanation: "Correct. The feature needs to be enabled in the controller."
