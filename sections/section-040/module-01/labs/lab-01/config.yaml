# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Self-Heal With A Narrow Ignore Rule (LAB). Section 040.
# Argo CD 3.5.4 and an in-cluster Gitea server (plumbing only). Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-065-lab-040-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - ghcr.io/stefanprodan/podinfo:6.14.0
      - gitea/gitea:28.1.0-rootless
      - quay.io/argoproj/argocd:v3.5.4
      - public.ecr.aws/docker/library/redis:8.2.3-alpine
  portForwards:
    - name: argocd
      description: "Argo CD API server and web page"
      namespace: argocd
      resource: svc/argocd-server
      targetPort: 443
      hostPort: 8080
      scheme: https
    - name: gitea
      description: "The Git server (git over HTTP)"
      namespace: gitea
      resource: svc/gitea-http
      targetPort: 3000
      hostPort: 3000
      scheme: http

bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  init:
    - name: install-gitea
      description: "Starts the in-cluster Git server"
      type: file
      source: bootstrap/01-install-gitea.sh
    - name: install-argocd
      description: "Installs Argo CD 3.5.4 (non-HA, without Dex and notifications)"
      type: file
      source: bootstrap/02-install-argocd.sh
    - name: seed
      description: "Pushes the repositories into Git"
      type: file
      source: bootstrap/03-seed.sh
    - name: create-application-and-drift
      description: "Creates the Application and changes the live Deployment by hand"
      type: file
      source: bootstrap/04-create-application-and-drift.sh
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet

testing:
  init:
    - name: solution
      description: Reference solution applied by `astrona test`
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: sync-policy
      description: "Automated sync has prune and selfHeal, and RespectIgnoreDifferences is set"
      type: file
      source: validation/validate-sync-policy.sh
      hint: "Edit the Application: syncPolicy.automated.prune and selfHeal true, and add RespectIgnoreDifferences=true to syncOptions."
    - name: ignore-narrow
      description: "One ignore rule covers only /spec/replicas of the Deployment scout"
      type: file
      source: validation/validate-ignore-narrow.sh
      hint: "Add one ignoreDifferences entry with group apps, kind Deployment, name scout and jsonPointers /spec/replicas. Do not ignore the whole spec."
    - name: drift-handled
      description: "The manual image change is reverted and the 3 replicas are kept"
      type: file
      source: validation/validate-drift-handled.sh
      hint: "Wait for self-heal. The image returns to 6.15.0 and replicas stay at 3 only if RespectIgnoreDifferences is set."

teardown:
  keepCluster: false
