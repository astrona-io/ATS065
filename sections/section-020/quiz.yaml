schema_version: 1
kind: question_bank
id: ats065-020
course_id: ATS065
exam_code: CGOA
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-020
  title: "Versions, References, Releases, Audit And Promotion"
questions:
  - id: ats065-020-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain why a commit is the unit of immutable history"
    source_readings:
      - sections/section-020/module-01/course-01-commits-branches-and-tags.md
    prompt: |-
      Why can a Git commit ID be used as a fixed reference to a state?
    options:
      - id: a
        text: "The ID is derived from the content and the parent commit, so changing the content produces a different ID."
        explanation: "Correct. A commit cannot be altered in place. A change creates a new commit."
      - id: b
        text: "The ID is assigned by the Git server in order of arrival."
        explanation: "Commit IDs are computed by Git from content, not assigned by a server."
      - id: c
        text: "The ID changes every time the branch is pulled."
        explanation: "Pulling does not change a commit ID."
      - id: d
        text: "The ID is a timestamp, so it always points to the latest state."
        explanation: "The ID is a hash and does not carry a time ordering."
    correct_option: a
    explanation: "Correct. A commit cannot be altered in place. A change creates a new commit."
  - id: ats065-020-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Tell a branch from a tag"
    source_readings:
      - sections/section-020/module-01/course-01-commits-branches-and-tags.md
    prompt: |-
      A repository has a branch `main` and a tag `v1.0.0`. Which statement is correct?
    options:
      - id: a
        text: "Both always move to the newest commit."
        explanation: "A tag is meant to stay on one commit."
      - id: b
        text: "A branch is a moving pointer that advances with new commits. A tag is meant to stay on one commit, but it can be moved on purpose."
        explanation: "Correct. A tag is only as fixed as the team policy and the server protection that guard it."
      - id: c
        text: "A tag cannot be deleted or moved by anyone."
        explanation: "Git allows deleting or forcing a tag. Server rules can block this."
      - id: d
        text: "A branch cannot be reached by Argo CD."
        explanation: "Argo CD can track a branch, a tag or a commit."
    correct_option: b
    explanation: "Correct. A tag is only as fixed as the team policy and the server protection that guard it."
  - id: ats065-020-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain the risk of tracking a branch"
    source_readings:
      - sections/section-020/module-01/course-01-commits-branches-and-tags.md
    prompt: |-
      An `Application` uses `targetRevision: main`. Why does this make the deployed state depend on more than a review of one commit?
    options:
      - id: a
        text: "A branch name is rejected by Argo CD."
        explanation: "Argo CD accepts a branch name."
      - id: b
        text: "Each new commit on `main` becomes the new target at the next refresh, so the target moves without a change to the Application."
        explanation: "Correct. The Application stays the same while the revision it resolves to changes."
      - id: c
        text: "A branch can hold only one file."
        explanation: "A branch holds the whole tree."
      - id: d
        text: "Argo CD ignores commits that are not tagged."
        explanation: "Argo CD resolves the branch to its head commit."
    correct_option: b
    explanation: "Correct. The Application stays the same while the revision it resolves to changes."
  - id: ats065-020-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain how an Application is pinned"
    source_readings:
      - sections/section-020/module-01/course-02-pinning-rollback-and-audit.md
    prompt: |-
      A team sets `targetRevision` to a full commit ID. What does the sync resolve and record?
    options:
      - id: a
        text: "It resolves the commit ID to itself and records it as the synced revision in the Application status."
        explanation: "Correct. The pin keeps the same input until someone edits the Application."
      - id: b
        text: "It resolves to the latest commit of `main`."
        explanation: "A commit ID is already a fixed revision."
      - id: c
        text: "It resolves to the newest tag."
        explanation: "A tag is not involved when a commit is named."
      - id: d
        text: "It records nothing, because commit IDs are not stored."
        explanation: "The synced revision is part of the status."
    correct_option: a
    explanation: "Correct. The pin keeps the same input until someone edits the Application."
  - id: ats065-020-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Describe rollback as a new commit in the source of truth"
    source_readings:
      - sections/section-020/module-01/course-02-pinning-rollback-and-audit.md
    prompt: |-
      Automated sync is on and the team wants to return to the previous version. Which approach keeps Git as the source of truth?
    options:
      - id: a
        text: "Use `argocd app rollback`, which works with automated sync on."
        explanation: "Rollback from the CLI is refused while automated sync is enabled, and it would not change Git."
      - id: b
        text: "Run `kubectl edit` on the Deployment."
        explanation: "The next sync or self-heal reverts it, and Git is not changed."
      - id: c
        text: "Revert the bad commit with `git revert` and push it, so the repository states the earlier content again."
        explanation: "Correct. History is kept, and the pull loop applies the reverted state."
      - id: d
        text: "Delete the Application and recreate it."
        explanation: "This does not address the bad state in the repository."
    correct_option: c
    explanation: "Correct. History is kept, and the pull loop applies the reverted state."
  - id: ats065-020-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use history as an audit record"
    source_readings:
      - sections/section-020/module-01/course-02-pinning-rollback-and-audit.md
    prompt: |-
      Which command shows who changed the `scout` image tag, when, and why, from the repository alone?
    options:
      - id: a
        text: "`kubectl get events`"
        explanation: "Events record cluster activity for a short time and do not hold the author or the reason."
      - id: b
        text: "`git log -p -- overlays/production/kustomization.yaml`"
        explanation: "Correct. The log shows the author, date, message and the change to that file."
      - id: c
        text: "`argocd app list`"
        explanation: "This lists applications and their status."
      - id: d
        text: "`kubectl describe pod shuttle`"
        explanation: "This describes a pod, not a change record."
    correct_option: b
    explanation: "Correct. The log shows the author, date, message and the change to that file."
  - id: ats065-020-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain promotion as a change of a reference"
    source_readings:
      - sections/section-020/module-01/course-03-promotion-immutable-artifacts-and-secrets.md
    prompt: |-
      How is a release promoted from staging to production in the course model?
    options:
      - id: a
        text: "The image is rebuilt with a production tag."
        explanation: "Rebuilding creates a different artifact, so what was tested is not what is promoted."
      - id: b
        text: "The same immutable image reference moves into the production overlay by a reviewed commit."
        explanation: "Correct. The artifact stays the same and only the declaration changes."
      - id: c
        text: "The staging namespace is renamed."
        explanation: "Renaming does not deploy a release."
      - id: d
        text: "A person runs `kubectl set image` on production."
        explanation: "This bypasses the repository."
    correct_option: b
    explanation: "Correct. The artifact stays the same and only the declaration changes."
  - id: ats065-020-q08
    type: single_choice
    difficulty: advanced
    learning_objective: "Explain why a mutable tag is a weak reference"
    source_readings:
      - sections/section-020/module-01/course-03-promotion-immutable-artifacts-and-secrets.md
    prompt: |-
      An overlay uses `image: scout:latest`. What is the weakness?
    options:
      - id: a
        text: "`latest` is not a valid tag."
        explanation: "`latest` is valid."
      - id: b
        text: "Kubernetes cannot pull an image with `latest`."
        explanation: "It can pull it."
      - id: c
        text: "The same text can point to different content over time, so the repository does not fix what runs."
        explanation: "Correct. Use a version tag that is never reused or a digest."
      - id: d
        text: "Argo CD forbids `latest` in a manifest."
        explanation: "Argo CD does not forbid it."
    correct_option: c
    explanation: "Correct. Use a version tag that is never reused or a digest."
  - id: ats065-020-q09
    type: single_choice
    difficulty: advanced
    learning_objective: "Explain secrets in a declarative repository"
    source_readings:
      - sections/section-020/module-01/course-03-promotion-immutable-artifacts-and-secrets.md
    prompt: |-
      A team wants every value in Git, including a database password. What is the sound approach?
    options:
      - id: a
        text: "Store the password in a plain `Secret` manifest, because base64 is encryption."
        explanation: "Base64 is an encoding, and anyone with the file can decode it."
      - id: b
        text: "Keep the password out of the repository and commit only an encrypted or referenced form that a controller turns into the `Secret`."
        explanation: "Correct. The repository states the intent, and the value stays protected."
      - id: c
        text: "Put the password in a branch name."
        explanation: "A branch name is visible to every reader."
      - id: d
        text: "Commit the password and delete it in the next commit."
        explanation: "History keeps the old commit, so the value stays exposed."
    correct_option: b
    explanation: "Correct. The repository states the intent, and the value stays protected."
  - id: ats065-020-q10
    type: single_choice
    difficulty: beginner
    learning_objective: "Read what a commit contains"
    source_readings:
      - sections/section-020/module-02/course-01-what-the-history-records.md
    prompt: |-
      Which list names what a Git commit records?
    options:
      - id: a
        text: "A snapshot of the files, the parent commit, the author, the committer and a message."
        explanation: "A commit is a snapshot with metadata and a pointer to its parent."
      - id: b
        text: "Only the lines that changed, with no parent."
        explanation: "A commit points to a snapshot and to its parent."
      - id: c
        text: "The cluster state at the time of the commit."
        explanation: "Git has no knowledge of the cluster."
      - id: d
        text: "The result of the sync that followed."
        explanation: "The sync result is recorded by the agent, not by Git."
    correct_option: a
    explanation: "Correct. A commit is a snapshot with metadata and a pointer to its parent."
  - id: ats065-020-q11
    type: single_choice
    difficulty: intermediate
    learning_objective: "State what history does not prove"
    source_readings:
      - sections/section-020/module-02/course-01-what-the-history-records.md
    prompt: |-
      A commit shows the author name `Dana Whit`. What does this prove when commits are not signed?
    options:
      - id: a
        text: "That Dana Whit made and reviewed the change."
        explanation: "The name is a claim and is not proven."
      - id: b
        text: "Nothing certain, because the author name is set by the person who makes the commit."
        explanation: "Without a signature, anyone can set any name and email in their Git configuration."
      - id: c
        text: "That the change was deployed."
        explanation: "Git does not record deployment."
      - id: d
        text: "That the change passed all tests."
        explanation: "Tests are not recorded in the commit."
    correct_option: b
    explanation: "Correct. Without a signature, anyone can set any name and email in their Git configuration."
  - id: ats065-020-q12
    type: single_choice
    difficulty: beginner
    learning_objective: "Answer an audit question from history"
    source_readings:
      - sections/section-020/module-02/course-01-what-the-history-records.md
    prompt: |-
      Which command lists the commits that changed one file, with their diffs?
    options:
      - id: a
        text: "`git status path/to/file`"
        explanation: "This shows the working tree state."
      - id: b
        text: "`git remote -v`"
        explanation: "This lists remotes."
      - id: c
        text: "`git log -p -- path/to/file`"
        explanation: "The path after `--` limits the log to that file and `-p` shows the patch."
      - id: d
        text: "`git init path/to/file`"
        explanation: "This creates a repository."
    correct_option: c
    explanation: "Correct. The path after `--` limits the log to that file and `-p` shows the patch."
  - id: ats065-020-q13
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain what a signature proves"
    source_readings:
      - sections/section-020/module-02/course-02-signed-commits-and-tag-verification.md
    prompt: |-
      A commit has a valid signature. What does it show?
    options:
      - id: a
        text: "That the change was reviewed by two people."
        explanation: "Review is shown by the pull request, not by a signature."
      - id: b
        text: "That the change is correct."
        explanation: "A signature says nothing about correctness."
      - id: c
        text: "That the commit is in the main branch."
        explanation: "A signed commit can be on any branch."
      - id: d
        text: "That the holder of the signing key created the commit and that it was not changed afterwards."
        explanation: "A signature binds the content to a key. It does not say the change was reviewed or good."
    correct_option: d
    explanation: "Correct. A signature binds the content to a key. It does not say the change was reviewed or good."
  - id: ats065-020-q14
    type: single_choice
    difficulty: intermediate
    learning_objective: "Tell annotated tags from lightweight tags"
    source_readings:
      - sections/section-020/module-02/course-02-signed-commits-and-tag-verification.md
    prompt: |-
      How does an annotated tag differ from a lightweight tag?
    options:
      - id: a
        text: "An annotated tag is its own object with tagger, date and message, and it can be signed. A lightweight tag is only a name for a commit."
        explanation: "Only the annotated form carries data that can be shown and signed."
      - id: b
        text: "There is no difference."
        explanation: "They are stored differently."
      - id: c
        text: "A lightweight tag can be signed and an annotated tag cannot."
        explanation: "It is the reverse."
      - id: d
        text: "An annotated tag moves with each commit."
        explanation: "Tags do not move on their own."
    correct_option: a
    explanation: "Correct. Only the annotated form carries data that can be shown and signed."
  - id: ats065-020-q15
    type: single_choice
    difficulty: intermediate
    learning_objective: "Verify a signed tag"
    source_readings:
      - sections/section-020/module-02/course-02-signed-commits-and-tag-verification.md
    prompt: |-
      Which command checks the signature of the tag `v1.4.0`?
    options:
      - id: a
        text: "`git tag -d v1.4.0`"
        explanation: "This deletes the tag."
      - id: b
        text: "`git tag -v v1.4.0`"
        explanation: "`git tag -v` verifies a signed tag."
      - id: c
        text: "`git tag -l v1.4.0`"
        explanation: "This lists tags."
      - id: d
        text: "`git push v1.4.0`"
        explanation: "This is not a valid push."
    correct_option: b
    explanation: "Correct. `git tag -v` verifies a signed tag."
  - id: ats065-020-q16
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use review and branch protection"
    source_readings:
      - sections/section-020/module-02/course-03-review-codeowners-and-branch-protection.md
    prompt: |-
      Which settings on the branch that the agent follows keep an unreviewed change out of production?
    options:
      - id: a
        text: "Allow direct pushes from every maintainer so that fixes are fast."
        explanation: "This removes the review step."
      - id: b
        text: "Make the branch public."
        explanation: "Visibility does not control who can change it."
      - id: c
        text: "Require a pull request with approvals, and block direct pushes and force pushes."
        explanation: "Because the agent applies what the branch contains, the branch is the control point."
      - id: d
        text: "Turn on Git compression."
        explanation: "Compression does not affect review."
    correct_option: c
    explanation: "Correct. Because the agent applies what the branch contains, the branch is the control point."
  - id: ats065-020-q17
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain CODEOWNERS"
    source_readings:
      - sections/section-020/module-02/course-03-review-codeowners-and-branch-protection.md
    prompt: |-
      What does a `CODEOWNERS` file do?
    options:
      - id: a
        text: "It encrypts files for the named owners."
        explanation: "It does not encrypt anything."
      - id: b
        text: "It chooses which cluster a path deploys to."
        explanation: "The Application chooses the destination."
      - id: c
        text: "It runs the sync for the named owners."
        explanation: "It is a review rule, not a sync rule."
      - id: d
        text: "It names the people or teams who must review changes to matching paths, and the host can require their approval."
        explanation: "Owners are matched by path, for example `overlays/production/`."
    correct_option: d
    explanation: "Correct. Owners are matched by path, for example `overlays/production/`."
  - id: ats065-020-q18
    type: single_choice
    difficulty: advanced
    learning_objective: "Predict the effect of a force push"
    source_readings:
      - sections/section-020/module-02/course-04-rewriting-history.md
    prompt: |-
      A force push replaces a commit on the followed branch. What does the agent do?
    options:
      - id: a
        text: "It resolves the branch to the new commit and applies that state, and the replaced commit can no longer be reached from the branch."
        explanation: "The agent follows the branch name. Rewritten history changes what the name points to."
      - id: b
        text: "It keeps the old commit forever."
        explanation: "The old commit is not reachable from the branch afterwards."
      - id: c
        text: "It stops and waits for a person."
        explanation: "It follows the branch to the new commit."
      - id: d
        text: "It deletes the Application."
        explanation: "A force push does not delete Applications."
    correct_option: a
    explanation: "Correct. The agent follows the branch name. Rewritten history changes what the name points to."
  - id: ats065-020-q19
    type: single_choice
    difficulty: intermediate
    learning_objective: "Roll back without rewriting"
    source_readings:
      - sections/section-020/module-02/course-04-rewriting-history.md
    prompt: |-
      Which command rolls back a bad commit and keeps the history intact?
    options:
      - id: a
        text: "`git reset --hard <earlier>` followed by a force push"
        explanation: "This rewrites the history."
      - id: b
        text: "`git revert <commit>`"
        explanation: "A revert adds a new commit that undoes the change, so the record of both stays."
      - id: c
        text: "`git commit --amend` on the shared branch"
        explanation: "This rewrites a published commit."
      - id: d
        text: "`git rebase -i` on the shared branch"
        explanation: "This rewrites published commits."
    correct_option: b
    explanation: "Correct. A revert adds a new commit that undoes the change, so the record of both stays."
  - id: ats065-020-q20
    type: single_choice
    difficulty: intermediate
    learning_objective: "Protect the history"
    source_readings:
      - sections/section-020/module-01/course-04-keeping-the-history-safe.md
    prompt: |-
      Which setting best protects the deployment history on the shared Git host?
    options:
      - id: a
        text: "Block force pushes and deletion of the followed branch, and keep a copy of the repository elsewhere."
        explanation: "History is the record of the deployment, so it needs both protection and a backup."
      - id: b
        text: "Allow force pushes so mistakes can be hidden quickly."
        explanation: "Force pushes rewrite history."
      - id: c
        text: "Keep the only copy on one laptop."
        explanation: "This is a single point of failure."
      - id: d
        text: "Delete old tags to save space."
        explanation: "Old tags are part of the record."
    correct_option: a
    explanation: "Correct. History is the record of the deployment, so it needs both protection and a backup."
  - id: ats065-020-q21
    type: single_choice
    difficulty: beginner
    learning_objective: "Choose a version scheme"
    source_readings:
      - sections/section-020/module-03/course-01-versioning-schemes-and-identifiers.md
    prompt: |-
      A release identifier must tell a reader whether an upgrade may break users. Which scheme does that?
    options:
      - id: a
        text: "A timestamp, which orders releases and says nothing about compatibility."
        explanation: "A timestamp does not carry compatibility."
      - id: b
        text: "Semantic versioning, where the major number changes for incompatible changes."
        explanation: "The parts of a semantic version carry the compatibility meaning."
      - id: c
        text: "The word latest."
        explanation: "It points to a moving image."
      - id: d
        text: "A random string."
        explanation: "It carries no meaning."
    correct_option: b
    explanation: "Correct. The parts of a semantic version carry the compatibility meaning."
  - id: ats065-020-q22
    type: single_choice
    difficulty: intermediate
    learning_objective: "Name the immutable identifier"
    source_readings:
      - sections/section-020/module-03/course-01-versioning-schemes-and-identifiers.md
    prompt: |-
      Which image reference stays the same content over time?
    options:
      - id: a
        text: "A tag such as `1.0`."
        explanation: "A tag can be moved to other content."
      - id: b
        text: "The tag `latest`."
        explanation: "`latest` is a moving tag."
      - id: c
        text: "A reference by digest, such as `image@sha256:...`."
        explanation: "A digest names the exact content. Tags can be moved."
      - id: d
        text: "A branch name."
        explanation: "A branch moves with each commit."
    correct_option: c
    explanation: "Correct. A digest names the exact content. Tags can be moved."
  - id: ats065-020-q23
    type: single_choice
    difficulty: intermediate
    learning_objective: "Place the declared-state commit"
    source_readings:
      - sections/section-020/module-03/course-02-from-build-to-declared-state.md
    prompt: |-
      A pipeline builds an image. How does the new image reach the cluster in a GitOps flow?
    options:
      - id: a
        text: "The pipeline runs `kubectl set image` on the cluster."
        explanation: "That is a push that bypasses Git."
      - id: b
        text: "The cluster watches the build server directly."
        explanation: "The agent reads the declared state in Git."
      - id: c
        text: "Developers edit the Deployment by hand in the cluster."
        explanation: "This leaves no record in Git."
      - id: d
        text: "The pipeline or a bot commits the new image reference to the configuration repository, and the agent pulls that commit."
        explanation: "The commit is the deployment record."
    correct_option: d
    explanation: "Correct. The commit is the deployment record."
  - id: ats065-020-q24
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain image update automation"
    source_readings:
      - sections/section-020/module-03/course-03-image-update-automation.md
    prompt: |-
      How does image update automation keep Git as the source of truth?
    options:
      - id: a
        text: "It writes the new tag as a commit to the repository, so the update has history and can be reverted."
        explanation: "The tool changes Git, not the cluster."
      - id: b
        text: "It patches the live Deployment and leaves Git alone."
        explanation: "That causes drift."
      - id: c
        text: "It deletes the old tag from the registry."
        explanation: "It does not do that."
      - id: d
        text: "It disables the agent while it works."
        explanation: "It does not."
    correct_option: a
    explanation: "Correct. The tool changes Git, not the cluster."
  - id: ats065-020-q25
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose revert over reset"
    source_readings:
      - sections/section-020/module-03/course-04-rolling-back-safely.md
    prompt: |-
      A bad release is on `main` and the team shares the branch. Which rollback keeps the history?
    options:
      - id: a
        text: "`git reset --hard` and a force push."
        explanation: "This rewrites shared history."
      - id: b
        text: "`git revert` of the bad commit, which adds a new commit that undoes it."
        explanation: "A revert is a normal commit that the agent pulls."
      - id: c
        text: "Deleting the repository and starting again."
        explanation: "This destroys the record."
      - id: d
        text: "Editing the live objects by hand."
        explanation: "This leaves Git different from the cluster."
    correct_option: b
    explanation: "Correct. A revert is a normal commit that the agent pulls."
