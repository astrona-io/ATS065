# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Roll Back A Bad Release With A Revert (LAB). Section 020.
# Argo CD 3.5.4 and an in-cluster Gitea server (plumbing only). Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-065-lab-020-03
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - ghcr.io/stefanprodan/podinfo:6.14.0
      - gitea/gitea:28.1.0-rootless
      - quay.io/argoproj/argocd:v3.5.4
      - public.ecr.aws/docker/library/redis:8.2.3-alpine
  portForwards:
    - name: argocd
      description: "Argo CD API server and web page"
      namespace: argocd
      resource: svc/argocd-server
      targetPort: 443
      hostPort: 8080
      scheme: https
    - name: gitea
      description: "The Git server (git over HTTP)"
      namespace: gitea
      resource: svc/gitea-http
      targetPort: 3000
      hostPort: 3000
      scheme: http

bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  init:
    - name: install-gitea
      description: "Starts the in-cluster Git server"
      type: file
      source: bootstrap/01-install-gitea.sh
    - name: install-argocd
      description: "Installs Argo CD 3.5.4 (non-HA, without Dex and notifications)"
      type: file
      source: bootstrap/02-install-argocd.sh
    - name: seed
      description: "Pushes the repositories into Git"
      type: file
      source: bootstrap/03-seed.sh
    - name: create-application
      description: "Creates the Application that follows main"
      type: file
      source: bootstrap/04-create-application.sh
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet

testing:
  init:
    - name: solution
      description: Reference solution applied by `astrona test`
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: history
      description: "The earlier commits are still on main and the head is a new commit"
      type: file
      source: validation/validate-history.sh
      hint: "Use git revert and a normal push. Do not reset or force push."
    - name: restored
      description: "The Application is Synced and Healthy on the image 6.15.0"
      type: file
      source: validation/validate-restored.sh
      hint: "Revert the last commit in Git. Do not edit the live Deployment."
    - name: tag
      description: "The annotated tag known-good points at the head commit"
      type: file
      source: validation/validate-tag.sh
      hint: "Create the tag after the revert commit with git tag -a known-good -m message, then push the tag."

teardown:
  keepCluster: false
