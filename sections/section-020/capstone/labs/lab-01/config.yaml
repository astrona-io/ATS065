# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Capstone: Promote A Release By Tag (LAB). Section 020.
# Argo CD 3.5.4 and an in-cluster Gitea server (plumbing only). Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-065-capstone-020
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - ghcr.io/stefanprodan/podinfo:6.14.0
      - gitea/gitea:28.1.0-rootless
      - quay.io/argoproj/argocd:v3.5.4
      - public.ecr.aws/docker/library/redis:8.2.3-alpine
  portForwards:
    - name: argocd
      description: "Argo CD API server and web page"
      namespace: argocd
      resource: svc/argocd-server
      targetPort: 443
      hostPort: 8080
      scheme: https
    - name: gitea
      description: "The Git server (git over HTTP)"
      namespace: gitea
      resource: svc/gitea-http
      targetPort: 3000
      hostPort: 3000
      scheme: http

bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  init:
    - name: install-gitea
      description: "Starts the in-cluster Git server"
      type: file
      source: bootstrap/01-install-gitea.sh
    - name: install-argocd
      description: "Installs Argo CD 3.5.4 (non-HA, without Dex and notifications)"
      type: file
      source: bootstrap/02-install-argocd.sh
    - name: seed
      description: "Pushes the repositories into Git"
      type: file
      source: bootstrap/03-seed.sh
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet

testing:
  init:
    - name: solution
      description: Reference solution applied by `astrona test`
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: applications
      description: "staging follows main, production is pinned to the tag v1.2.0, both have automated sync"
      type: file
      source: validation/validate-applications.sh
      hint: "Create two Applications in the argocd namespace. Set targetRevision v1.2.0 on the production Application."
    - name: tag-promoted
      description: "The tag v1.2.0 exists on the commit Release 1.2 and production applied that exact commit"
      type: file
      source: validation/validate-tag-promoted.sh
      hint: "Create the tag on the newest commit of main with git tag and push it with git push origin v1.2.0."
    - name: environments-served
      description: "Both environments are Synced, Healthy and serve release 1.2 on podinfo 6.15.0"
      type: file
      source: validation/validate-environments-served.sh
      hint: "Wait for both Applications to reconcile. The tag, not main, decides what production runs."

teardown:
  keepCluster: false
