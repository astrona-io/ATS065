# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Pull From A Private Repository (LAB). Section 030.
# Argo CD 3.5.4 and an in-cluster Gitea server (plumbing only). Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-065-lab-030-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - ghcr.io/stefanprodan/podinfo:6.14.0
      - gitea/gitea:28.1.0-rootless
      - quay.io/argoproj/argocd:v3.5.4
      - public.ecr.aws/docker/library/redis:8.2.3-alpine
  portForwards:
    - name: argocd
      description: "Argo CD API server and web page"
      namespace: argocd
      resource: svc/argocd-server
      targetPort: 443
      hostPort: 8080
      scheme: https
    - name: gitea
      description: "The Git server (git over HTTP)"
      namespace: gitea
      resource: svc/gitea-http
      targetPort: 3000
      hostPort: 3000
      scheme: http

bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  init:
    - name: install-gitea
      description: "Starts the in-cluster Git server"
      type: file
      source: bootstrap/01-install-gitea.sh
    - name: install-argocd
      description: "Installs Argo CD 3.5.4 (non-HA, without Dex and notifications)"
      type: file
      source: bootstrap/02-install-argocd.sh
    - name: seed
      description: "Pushes the repositories into Git"
      type: file
      source: bootstrap/03-seed.sh
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet

testing:
  init:
    - name: solution
      description: Reference solution applied by `astrona test`
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: repository-secret
      description: "A repository Secret for the private repository uses the read-only user argocd-reader"
      type: file
      source: validation/validate-repository-secret.sh
      hint: "Create a Secret in argocd with the label argocd.argoproj.io/secret-type=repository, type git, the repository URL and the user argocd-reader (password reader-pass-1)."
    - name: application
      description: "Application scout-staging pulls overlays/staging from main with automated sync"
      type: file
      source: validation/validate-application.sh
      hint: "Create the Application after the repository Secret exists."
    - name: pulled-change
      description: "The new message was committed to Git and pulled: scout serves pulled and Argo CD applied the newest commit"
      type: file
      source: validation/validate-pulled-change.sh
      hint: "Push a commit to main that sets the staging message to pulled (use the user platform to push), then refresh the Application."

teardown:
  keepCluster: false
