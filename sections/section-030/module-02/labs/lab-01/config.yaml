# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Read The Agent And Pull From Git (LAB). Section 030.
# Argo CD 3.5.4 and an in-cluster Gitea server (plumbing only). Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-065-lab-030-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - ghcr.io/stefanprodan/podinfo:6.14.0
      - gitea/gitea:28.1.0-rootless
      - quay.io/argoproj/argocd:v3.5.4
      - public.ecr.aws/docker/library/redis:8.2.3-alpine
  portForwards:
    - name: argocd
      description: "Argo CD API server and web page"
      namespace: argocd
      resource: svc/argocd-server
      targetPort: 443
      hostPort: 8080
      scheme: https
    - name: gitea
      description: "The Git server (git over HTTP)"
      namespace: gitea
      resource: svc/gitea-http
      targetPort: 3000
      hostPort: 3000
      scheme: http

bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  init:
    - name: install-gitea
      description: "Starts the in-cluster Git server"
      type: file
      source: bootstrap/01-install-gitea.sh
    - name: install-argocd
      description: "Installs Argo CD 3.5.4 (non-HA, without Dex and notifications)"
      type: file
      source: bootstrap/02-install-argocd.sh
    - name: seed
      description: "Pushes the repositories into Git"
      type: file
      source: bootstrap/03-seed.sh

  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet

testing:
  init:
    - name: solution
      description: Reference solution applied by `astrona test`
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: application
      description: "Application scout-staging pulls overlays/staging from main with automated sync"
      type: file
      source: validation/validate-application.sh
      hint: "Create the Application in the argocd namespace with project default, path overlays/staging, targetRevision main and syncPolicy.automated."
    - name: agent-report
      description: "ConfigMap agent-report names the components and the permission as they are in the cluster"
      type: file
      source: validation/validate-agent-report.sh
      hint: "Read kubectl -n argocd get deploy,statefulset. Use kubectl auth can-i with --as=system:serviceaccount:argocd:argocd-application-controller to answer can-delete-namespaces with yes or no."
    - name: delivered
      description: "The Application is Synced and Healthy and the service answers"
      type: file
      source: validation/validate-delivered.sh
      hint: "Wait for Argo CD to pull and apply the repository. Read the Application conditions if it stays OutOfSync."

teardown:
  keepCluster: false
