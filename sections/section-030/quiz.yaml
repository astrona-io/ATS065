schema_version: 1
kind: question_bank
id: ats065-030
course_id: ATS065
exam_code: CGOA
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-030
  title: "Pull, Credentials, Agents, Tenancy And Webhooks"
questions:
  - id: ats065-030-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Tell push delivery from pull delivery"
    source_readings:
      - sections/section-030/module-01/course-01-push-versus-pull.md
    prompt: |-
      A CI job runs `kubectl apply` against production with a cluster credential stored in the CI system. What is this called, and what is the main exposure?
    options:
      - id: a
        text: "Pull delivery, because the CI system reads the repository."
        explanation: "Reading the repository is not what makes it pull. The CI system pushes into the cluster."
      - id: b
        text: "Push delivery. The credential that can change the cluster lives outside the cluster and must be reachable from it."
        explanation: "Correct. In pull delivery, the agent inside the cluster holds the access and reaches out to the repository."
      - id: c
        text: "Push delivery, and it has no credential exposure."
        explanation: "A credential for the cluster is stored in the CI system."
      - id: d
        text: "Pull delivery, because the job runs on a schedule."
        explanation: "A schedule does not change who holds the cluster access."
    correct_option: b
    explanation: "Correct. In pull delivery, the agent inside the cluster holds the access and reaches out to the repository."
  - id: ats065-030-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Describe the direction of the connection in pull delivery"
    source_readings:
      - sections/section-030/module-01/course-01-push-versus-pull.md
    prompt: |-
      In pull delivery, which direction does the network connection open?
    options:
      - id: a
        text: "From the Git server into the cluster."
        explanation: "That would be push, and it needs an inbound path to the cluster."
      - id: b
        text: "From a person's laptop into the cluster API."
        explanation: "This is manual access."
      - id: c
        text: "From the agent in the cluster out to the Git server."
        explanation: "Correct. The cluster needs only outbound access to the repository."
      - id: d
        text: "From the CI system into the Git server."
        explanation: "This is the build path, not the delivery path."
    correct_option: c
    explanation: "Correct. The cluster needs only outbound access to the repository."
  - id: ats065-030-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Configure repository credentials for Argo CD"
    source_readings:
      - sections/section-030/module-01/course-02-repository-credentials.md
    prompt: |-
      How does Argo CD learn the credentials for a private repository in this course?
    options:
      - id: a
        text: "From a `Secret` in the `argocd` namespace labelled `argocd.argoproj.io/secret-type: repository`, holding the URL, username and password."
        explanation: "Correct. Argo CD reads repository Secrets with that label."
      - id: b
        text: "From the `Application` spec, in a `password` field."
        explanation: "The Application does not hold credentials."
      - id: c
        text: "From an environment variable on the Gitea pod."
        explanation: "The Gitea pod does not configure Argo CD."
      - id: d
        text: "From the node's kubeconfig file."
        explanation: "The kubeconfig is not used for repository access."
    correct_option: a
    explanation: "Correct. Argo CD reads repository Secrets with that label."
  - id: ats065-030-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Apply least privilege to the pull credential"
    source_readings:
      - sections/section-030/module-01/course-02-repository-credentials.md
    prompt: |-
      Why does the lab use a read-only user `argocd-reader` for the repository?
    options:
      - id: a
        text: "A read-only user syncs faster."
        explanation: "Speed does not depend on this."
      - id: b
        text: "Argo CD cannot use a user that can write."
        explanation: "It can use any valid credential."
      - id: c
        text: "The pull loop only needs to read, so a leaked credential cannot change the source of truth."
        explanation: "Correct. The credential gets the smallest permission that does the job."
      - id: d
        text: "Gitea requires every user to be read-only."
        explanation: "Gitea supports write access."
    correct_option: c
    explanation: "Correct. The credential gets the smallest permission that does the job."
  - id: ats065-030-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read the failure when a credential is wrong"
    source_readings:
      - sections/section-030/module-01/course-02-repository-credentials.md
    prompt: |-
      The repository Secret holds a wrong password. What does the `Application` show?
    options:
      - id: a
        text: "`Synced`, using the last cached manifests with no error."
        explanation: "The failure appears as a condition, not as `Synced`."
      - id: b
        text: "A `ComparisonError` or connection condition that names an authentication failure, and the running workload does not change."
        explanation: "Correct. Nothing is applied while the repository cannot be read."
      - id: c
        text: "The workload is deleted."
        explanation: "A repository failure does not delete the workload."
      - id: d
        text: "The Application is removed automatically."
        explanation: "Argo CD does not remove it."
    correct_option: b
    explanation: "Correct. Nothing is applied while the repository cannot be read."
  - id: ats065-030-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain the polling interval"
    source_readings:
      - sections/section-030/module-01/course-03-polling-webhooks-and-outages.md
    prompt: |-
      No webhook is set. A commit is pushed. When does Argo CD see it by default?
    options:
      - id: a
        text: "Immediately, because Git notifies every client."
        explanation: "Git does not notify clients without a configured webhook."
      - id: b
        text: "Within about three minutes, at the next repository poll."
        explanation: "Correct. The default refresh interval is 3 minutes."
      - id: c
        text: "Only after a person restarts Argo CD."
        explanation: "A restart is not needed."
      - id: d
        text: "After 24 hours."
        explanation: "The default is far shorter."
    correct_option: b
    explanation: "Correct. The default refresh interval is 3 minutes."
  - id: ats065-030-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain what a webhook changes"
    source_readings:
      - sections/section-030/module-01/course-03-polling-webhooks-and-outages.md
    prompt: |-
      What does the webhook to `argocd-server` change?
    options:
      - id: a
        text: "It sends the manifests to the cluster."
        explanation: "The webhook sends an event, not manifests."
      - id: b
        text: "It tells Argo CD that a push happened so it refreshes now instead of waiting for the poll."
        explanation: "Correct. The webhook shortens the delay. Polling still works if the webhook fails."
      - id: c
        text: "It replaces the repository credential."
        explanation: "The credential is still needed to read the repository."
      - id: d
        text: "It lets Gitea edit the cluster."
        explanation: "The webhook does not give Gitea cluster access."
    correct_option: b
    explanation: "Correct. The webhook shortens the delay. Polling still works if the webhook fails."
  - id: ats065-030-q08
    type: single_choice
    difficulty: advanced
    learning_objective: "Reason about a repository outage"
    source_readings:
      - sections/section-030/module-01/course-03-polling-webhooks-and-outages.md
    prompt: |-
      The Git server is down for an hour. What happens to the running workload under pull delivery?
    options:
      - id: a
        text: "It keeps running as last applied, and the loop resumes reconciliation when the repository returns."
        explanation: "Correct. The desired state is not readable, but the live objects are not removed."
      - id: b
        text: "All pods are deleted."
        explanation: "An outage does not delete anything."
      - id: c
        text: "Argo CD applies an empty state."
        explanation: "It does not apply an empty state."
      - id: d
        text: "The cluster stops serving traffic."
        explanation: "The workload does not depend on Git to serve traffic."
    correct_option: a
    explanation: "Correct. The desired state is not readable, but the live objects are not removed."
  - id: ats065-030-q09
    type: single_choice
    difficulty: advanced
    learning_objective: "Reason about the webhook as an optimisation"
    source_readings:
      - sections/section-030/module-01/course-03-polling-webhooks-and-outages.md
    prompt: |-
      A webhook is not delivered because of a network error. What is the correct statement?
    options:
      - id: a
        text: "The change is lost forever."
        explanation: "The poll finds the commit."
      - id: b
        text: "The system is broken until an operator re-sends the event."
        explanation: "No re-send is required."
      - id: c
        text: "The change is found at the next poll, so the webhook only affects how fast it is seen."
        explanation: "Correct. The webhook is an optimisation, and polling is the fallback."
      - id: d
        text: "Argo CD rolls back the previous commit."
        explanation: "It does not roll back."
    correct_option: c
    explanation: "Correct. The webhook is an optimisation, and polling is the fallback."
  - id: ats065-030-q10
    type: single_choice
    difficulty: beginner
    learning_objective: "Name Argo CD components"
    source_readings:
      - sections/section-030/module-02/course-01-argo-cd-components.md
    prompt: |-
      Which Argo CD component renders manifests from the Git repository?
    options:
      - id: a
        text: "The repository server."
        explanation: "It clones the repository and runs the renderer, for example Helm or Kustomize."
      - id: b
        text: "The application controller."
        explanation: "It compares and applies. It asks the repository server for the render."
      - id: c
        text: "The Redis cache."
        explanation: "It caches data and renders nothing."
      - id: d
        text: "The Dex server."
        explanation: "It handles login and renders nothing."
    correct_option: a
    explanation: "Correct. It clones the repository and runs the renderer, for example Helm or Kustomize."
  - id: ats065-030-q11
    type: single_choice
    difficulty: intermediate
    learning_objective: "Name Argo CD components"
    source_readings:
      - sections/section-030/module-02/course-01-argo-cd-components.md
    prompt: |-
      Which component compares the rendered manifests with the live state and applies the difference?
    options:
      - id: a
        text: "The repository server."
        explanation: "It renders and does not apply."
      - id: b
        text: "The application controller."
        explanation: "It runs the reconciliation loop for every Application."
      - id: c
        text: "The API server."
        explanation: "It serves the UI, CLI and API."
      - id: d
        text: "The notifications controller."
        explanation: "It sends messages."
    correct_option: b
    explanation: "Correct. It runs the reconciliation loop for every Application."
  - id: ats065-030-q12
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict a component failure"
    source_readings:
      - sections/section-030/module-02/course-01-argo-cd-components.md
    prompt: |-
      The repository server of Argo CD stops. What is the effect on workloads that are already running?
    options:
      - id: a
        text: "They are deleted at once."
        explanation: "A stopped controller does not delete workloads."
      - id: b
        text: "They are rolled back to the last Git commit."
        explanation: "Nothing performs a rollback without the agent."
      - id: c
        text: "They keep running. New renders and so new changes are not delivered until it returns."
        explanation: "The agent is a control loop. Stopping it stops delivery and does not stop the workloads."
      - id: d
        text: "They move to another cluster."
        explanation: "Argo CD does not move workloads."
    correct_option: c
    explanation: "Correct. The agent is a control loop. Stopping it stops delivery and does not stop the workloads."
  - id: ats065-030-q13
    type: single_choice
    difficulty: beginner
    learning_objective: "Name Flux controllers"
    source_readings:
      - sections/section-030/module-02/course-02-flux-controllers-and-the-comparison.md
    prompt: |-
      Which pair of Flux objects fetches a Git repository and applies a path from it?
    options:
      - id: a
        text: "A `Deployment` and a `Service`."
        explanation: "These are workload objects."
      - id: b
        text: "A `Secret` and a `ConfigMap`."
        explanation: "These hold data."
      - id: c
        text: "An `Ingress` and a `Namespace`."
        explanation: "These are workload and scope objects."
      - id: d
        text: "A `GitRepository` and a `Kustomization`."
        explanation: "The source controller handles the first and the kustomize controller handles the second."
    correct_option: d
    explanation: "Correct. The source controller handles the first and the kustomize controller handles the second."
  - id: ats065-030-q14
    type: single_choice
    difficulty: intermediate
    learning_objective: "Name Flux controllers"
    source_readings:
      - sections/section-030/module-02/course-02-flux-controllers-and-the-comparison.md
    prompt: |-
      Which Flux controller fetches artifacts from Git and makes them available to other controllers?
    options:
      - id: a
        text: "The source controller."
        explanation: "It produces artifacts that the other controllers consume."
      - id: b
        text: "The kustomize controller."
        explanation: "It applies the artifact."
      - id: c
        text: "The notification controller."
        explanation: "It sends alerts and receives webhooks."
      - id: d
        text: "The helm controller."
        explanation: "It installs Helm releases."
    correct_option: a
    explanation: "Correct. It produces artifacts that the other controllers consume."
  - id: ats065-030-q15
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain network direction"
    source_readings:
      - sections/section-030/module-02/course-03-network-direction-and-cluster-credentials.md
    prompt: |-
      In a pull design, which side opens the connection to the Git repository?
    options:
      - id: a
        text: "The CI system."
        explanation: "In a push design, CI reaches the cluster."
      - id: b
        text: "The agent in the cluster."
        explanation: "The cluster reaches out and the repository needs no route into the cluster."
      - id: c
        text: "The Git host, towards the API server of the cluster."
        explanation: "This is the push direction."
      - id: d
        text: "A load balancer in front of the cluster."
        explanation: "A load balancer is not part of the fetch."
    correct_option: b
    explanation: "Correct. The cluster reaches out and the repository needs no route into the cluster."
  - id: ats065-030-q16
    type: single_choice
    difficulty: intermediate
    learning_objective: "Place credentials"
    source_readings:
      - sections/section-030/module-02/course-03-network-direction-and-cluster-credentials.md
    prompt: |-
      Which credential does a pull-based cluster need for the Git repository?
    options:
      - id: a
        text: "A cluster-admin kubeconfig stored in the CI system."
        explanation: "This is the push design."
      - id: b
        text: "A write token for the Git host."
        explanation: "The agent does not write to Git."
      - id: c
        text: "A read credential for the repository, stored in the cluster."
        explanation: "The agent only reads. The cluster credentials stay inside the cluster."
      - id: d
        text: "No credential, for private repositories."
        explanation: "A private repository needs a credential."
    correct_option: c
    explanation: "Correct. The agent only reads. The cluster credentials stay inside the cluster."
  - id: ats065-030-q17
    type: single_choice
    difficulty: intermediate
    learning_objective: "Describe an outage"
    source_readings:
      - sections/section-030/module-02/course-03-network-direction-and-cluster-credentials.md
    prompt: |-
      The Git host is unreachable for an hour. What happens in a pull-based cluster?
    options:
      - id: a
        text: "All workloads stop."
        explanation: "They do not depend on the repository."
      - id: b
        text: "The agent deletes everything."
        explanation: "It deletes nothing without a declared change."
      - id: c
        text: "The agent reverts to an empty state."
        explanation: "It keeps the last applied state."
      - id: d
        text: "The workloads keep running. New changes are not delivered until the repository is reachable again."
        explanation: "The agent has no new state to apply, and it keeps the last applied state."
    correct_option: d
    explanation: "Correct. The agent has no new state to apply, and it keeps the last applied state."
  - id: ats065-030-q18
    type: single_choice
    difficulty: advanced
    learning_objective: "Read the agent permissions"
    source_readings:
      - sections/section-030/module-02/course-04-the-permissions-of-the-agent.md
    prompt: |-
      In the default Argo CD installation, the application controller can create and delete almost any object in the cluster. What follows from this?
    options:
      - id: a
        text: "A commit to the followed branch can change almost anything, so the branch and the project need tight controls."
        explanation: "The rights of the agent are the rights of anyone who can merge to its branch."
      - id: b
        text: "Nothing, because Git review has no effect on the cluster."
        explanation: "Review controls what the agent applies."
      - id: c
        text: "The cluster is safe because Argo CD only reads."
        explanation: "It applies changes with its own rights."
      - id: d
        text: "Only the CI system can change the cluster."
        explanation: "In the pull design, the agent does."
    correct_option: a
    explanation: "Correct. The rights of the agent are the rights of anyone who can merge to its branch."
  - id: ats065-030-q19
    type: single_choice
    difficulty: advanced
    learning_objective: "Narrow the permissions"
    source_readings:
      - sections/section-030/module-02/course-04-the-permissions-of-the-agent.md
    prompt: |-
      Which setting limits which namespaces and clusters an Application can deploy to?
    options:
      - id: a
        text: "The `replicas` field of the Deployment."
        explanation: "It sets the pod count."
      - id: b
        text: "The `destinations` list of the `AppProject`."
        explanation: "A project restricts source repositories, destinations and resource kinds."
      - id: c
        text: "The `nodeSelector` of the controller."
        explanation: "It places pods and sets no permissions."
      - id: d
        text: "The `imagePullPolicy` of the pods."
        explanation: "It controls image pulls."
    correct_option: b
    explanation: "Correct. A project restricts source repositories, destinations and resource kinds."
  - id: ats065-030-q20
    type: single_choice
    difficulty: intermediate
    learning_objective: "Compare three revisions"
    source_readings:
      - sections/section-030/module-01/course-04-verify-what-was-pulled.md
    prompt: |-
      The compared revision of an Application is older than the head of the branch. What does this suggest?
    options:
      - id: a
        text: "The fetch is late or failing, so the credentials, network and repository conditions should be checked."
        explanation: "The agent has not seen the newest commit yet."
      - id: b
        text: "The cluster is ahead of Git."
        explanation: "The compared revision is the one the agent last read."
      - id: c
        text: "The application is Healthy, so nothing needs a check."
        explanation: "Health and revision are different things."
      - id: d
        text: "Git lost the commit."
        explanation: "A late fetch is far more likely."
    correct_option: a
    explanation: "Correct. The agent has not seen the newest commit yet."
  - id: ats065-030-q21
    type: single_choice
    difficulty: beginner
    learning_objective: "Use the in-cluster destination"
    source_readings:
      - sections/section-030/module-03/course-01-registering-clusters.md
    prompt: |-
      Which destination server address means the cluster where Argo CD runs?
    options:
      - id: a
        text: "`https://localhost:8080`"
        explanation: "This is not the cluster API address."
      - id: b
        text: "`https://kubernetes.default.svc`"
        explanation: "This is the in-cluster API server address. It needs no stored credential."
      - id: c
        text: "`https://argocd.example.com`"
        explanation: "This is a made-up host."
      - id: d
        text: "`https://git.example.com`"
        explanation: "This is a Git host."
    correct_option: b
    explanation: "Correct. This is the in-cluster API server address. It needs no stored credential."
  - id: ats065-030-q22
    type: single_choice
    difficulty: intermediate
    learning_objective: "State what a cluster credential grants"
    source_readings:
      - sections/section-030/module-03/course-01-registering-clusters.md
    prompt: |-
      What decides what Argo CD may change in a remote cluster that is registered with it?
    options:
      - id: a
        text: "The name of the Application."
        explanation: "The name does not grant rights."
      - id: b
        text: "The color theme of the UI."
        explanation: "It does not."
      - id: c
        text: "The permissions of the credential stored in the cluster Secret."
        explanation: "The service account or token in the Secret carries the rights."
      - id: d
        text: "The Git branch name."
        explanation: "It does not."
    correct_option: c
    explanation: "Correct. The service account or token in the Secret carries the rights."
  - id: ats065-030-q23
    type: single_choice
    difficulty: intermediate
    learning_objective: "Compare topologies"
    source_readings:
      - sections/section-030/module-03/course-02-hub-and-agent-topologies.md
    prompt: |-
      What is a trade-off of one central Argo CD managing many clusters?
    options:
      - id: a
        text: "It needs no credentials at all."
        explanation: "It stores credentials for each cluster."
      - id: b
        text: "It removes the need for Git."
        explanation: "Git is still the source."
      - id: c
        text: "Each cluster pulls on its own."
        explanation: "That describes standalone agents."
      - id: d
        text: "It gives a single view, and it holds credentials for every cluster and needs access to their API servers."
        explanation: "Central control concentrates both convenience and risk."
    correct_option: d
    explanation: "Correct. Central control concentrates both convenience and risk."
  - id: ats065-030-q24
    type: single_choice
    difficulty: intermediate
    learning_objective: "Limit a team with a project"
    source_readings:
      - sections/section-030/module-03/course-03-projects-and-tenant-boundaries.md
    prompt: |-
      Which AppProject setting prevents a team from creating cluster roles and namespaces through its applications?
    options:
      - id: a
        text: "An empty `clusterResourceWhitelist`."
        explanation: "An empty list allows no cluster-scoped kinds."
      - id: b
        text: "`sourceRepos: ['*']`"
        explanation: "This allows every repository."
      - id: c
        text: "`description: team`"
        explanation: "A description limits nothing."
      - id: d
        text: "`destinations: []` in the default project"
        explanation: "The default project is open."
    correct_option: a
    explanation: "Correct. An empty list allows no cluster-scoped kinds."
  - id: ats065-030-q25
    type: single_choice
    difficulty: advanced
    learning_objective: "Know the limit of a project"
    source_readings:
      - sections/section-030/module-03/course-03-projects-and-tenant-boundaries.md
    prompt: |-
      Why is an AppProject alone not enough to isolate two teams at runtime?
    options:
      - id: a
        text: "Projects are only labels."
        explanation: "They are enforced during sync."
      - id: b
        text: "A project checks what an Application asks for. Runtime isolation needs Kubernetes controls such as quotas, network policies and pod security."
        explanation: "The project governs delivery, not what pods can do."
      - id: c
        text: "Projects delete namespaces."
        explanation: "They do not."
      - id: d
        text: "Projects change the container runtime."
        explanation: "They do not."
    correct_option: b
    explanation: "Correct. The project governs delivery, not what pods can do."
  - id: ats065-030-q26
    type: single_choice
    difficulty: intermediate
    learning_objective: "Verify signatures"
    source_readings:
      - sections/section-030/module-03/course-04-trusting-the-source.md
    prompt: |-
      Which Flux setting makes the source controller refuse a Git revision that is not signed by a trusted key?
    options:
      - id: a
        text: "`spec.interval` of the Kustomization."
        explanation: "It sets a timing."
      - id: b
        text: "`spec.suspend` of the HelmRelease."
        explanation: "It pauses a release."
      - id: c
        text: "The `spec.verify` section of the `GitRepository`."
        explanation: "The controller verifies the signature and does not publish a revision that fails."
      - id: d
        text: "`metadata.labels` of the namespace."
        explanation: "Labels do not verify signatures."
    correct_option: c
    explanation: "Correct. The controller verifies the signature and does not publish a revision that fails."
